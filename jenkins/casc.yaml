# Jenkins configuration as code. Values in ${...} come from .env (see .env.example).
jenkins:
  systemMessage: "Configured by jenkins/casc.yaml. UI changes are overwritten on restart."
  # The controller only schedules; builds run on agents.
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: viewer
          password: ${JENKINS_VIEWER_PASSWORD}
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - Overall/Administer
        - user:
            name: viewer
            permissions:
              - Overall/Read
              - Job/Read
  nodes:
    - permanent:
        name: agent-1
        labelString: docker linux
        remoteFS: /home/jenkins/agent
        numExecutors: 2
        retentionStrategy: always
        launcher:
          ssh:
            host: agent
            port: 22
            credentialsId: agent-ssh
            # The agent is a container on a private compose network, so its host key is not pinned.
            sshHostKeyVerificationStrategy: nonVerifyingKeyVerificationStrategy
    # Windows host agent for jobs that need local files, started by scripts/windows-agent.ps1.
    - permanent:
        name: wardogs-pc
        labelString: windows wardogs
        remoteFS: C:/jenkins-agent
        numExecutors: 1
        retentionStrategy: always
        launcher:
          inbound:
            webSocket: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: agent-ssh
              username: jenkins
              description: SSH key Jenkins uses to start agent-1
              privateKeySource:
                directEntry:
                  privateKey: ${readFile:/run/secrets/agent_key}
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              description: Docker Hub access token
              username: ${DOCKERHUB_USER}
              password: ${DOCKERHUB_TOKEN}
          - usernamePassword:
              scope: GLOBAL
              id: github
              description: GitHub token for branch scans and commit statuses
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
          - string:
              scope: SYSTEM
              id: github-webhook-secret
              description: Secret GitHub signs webhook payloads with
              secret: ${GITHUB_WEBHOOK_SECRET}

unclassified:
  location:
    url: ${JENKINS_URL}
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: github-webhook-secret
  globalLibraries:
    libraries:
      - name: demo-lib
        defaultVersion: main
        retriever:
          modernSCM:
            libraryPath: shared-library/
            scm:
              git:
                remote: https://github.com/Kiyogitpy/jenkins-demo.git

jobs:
  - script: |
      multibranchPipelineJob('jenkins-demo') {
        description('Builds every branch and pull request of Kiyogitpy/jenkins-demo.')
        branchSources {
          branchSource {
            source {
              github {
                id('jenkins-demo')
                repoOwner('Kiyogitpy')
                repository('jenkins-demo')
                repositoryUrl('https://github.com/Kiyogitpy/jenkins-demo')
                configuredByUrl(true)
                credentialsId('github')
                traits {
                  gitHubBranchDiscovery { strategyId(1) }
                  gitHubPullRequestDiscovery { strategyId(1) }
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(5) }
        }
        // Webhooks trigger builds; this daily scan only catches missed events.
        triggers {
          periodicFolderTrigger { interval('1d') }
        }
      }
      pipelineJob('wardogs-patch-watch') {
        description('Runs the wardogs-data-docs patch update pipeline when Steam installs a new Wardogs build.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Kiyogitpy/wardogs-data-docs.git') }
                branch('*/main')
              }
            }
            scriptPath('jenkins/patch-watch.Jenkinsfile')
            lightweight(true)
          }
        }
      }
