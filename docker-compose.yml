services:
  jenkins:
    build: ./jenkins
    # root so the job can use the host Docker socket; fine for a local-only setup.
    user: root
    ports:
      - "8080:8080"
    environment:
      # Lets the job clone the bind-mounted repo at file:///repo.
      JAVA_OPTS: -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo:ro

volumes:
  jenkins_home:
