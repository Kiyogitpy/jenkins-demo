name: jenkins-demo

services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_casc/casc.yaml:ro
    secrets:
      - agent_key

  agent:
    build: ./agent
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY}
    volumes:
      - agent_work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  # Public HTTPS tunnel so GitHub webhooks reach Jenkins: docker compose --profile webhook up -d
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [webhook]
    command: http jenkins:8080 --url=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

secrets:
  agent_key:
    file: ./secrets/agent_key

volumes:
  jenkins_home:
  agent_work:
